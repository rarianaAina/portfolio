    />

    <!-- Applique le thème avant le premier rendu pour éviter un flash blanc. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('darkMode')
          var dark =
            stored !== null
              ? stored === 'true'
              : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* localStorage indisponible : on garde le thème clair par défaut. */
        }
      })()
    </script>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <!--
      Formulaire statique détecté par Netlify Forms au moment du build.
      L'application Vue poste sur ce même nom ; ne pas supprimer.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
